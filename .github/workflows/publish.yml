name: Daily Football Predictions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_predictions.py"
      - "scripts/update_api_football.py"
      - "scripts/update_sportmonks.py"
      - "scripts/sync_data_sources.py"
      - "tests/**"
      - "index.html"
      - "sw.js"
      - ".github/workflows/publish.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: goal-predictor-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Uruchom Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sprawdź testy modelu
        run: python -m unittest discover -s tests -v

      - name: Sprawdź składnię JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Zweryfikuj JavaScript osadzony w stronie
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.I | re.S)
          if not scripts:
              raise SystemExit("Nie znaleziono skryptów JavaScript w index.html")
          for i, source in enumerate(scripts):
              Path(f"/tmp/goal-predictor-inline-{i}.js").write_text(source, encoding="utf-8")
          print(f"Znaleziono {len(scripts)} osadzonych skryptów JavaScript.")
          PY
          for script in /tmp/goal-predictor-inline-*.js; do node --check "$script"; done

      - name: Sprawdź, czy publikacja jest potrzebna
        id: timecheck
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          HOUR=$(TZ=Europe/Warsaw date +%H)
          TODAY=$(TZ=Europe/Warsaw date +%F)
          GENERATED_DATE=$(python -c 'import json; from pathlib import Path; p=Path("data/latest.json"); print((json.loads(p.read_text(encoding="utf-8")).get("generatedAt") or "")[:10] if p.exists() else "")' 2>/dev/null || true)
          API_GENERATED_DATE=$(python -c 'import json; from pathlib import Path; p=Path("data/api-football.json"); print((json.loads(p.read_text(encoding="utf-8")).get("generatedAt") or "")[:10] if p.exists() else "")' 2>/dev/null || true)
          GENERATED_TO=$(python -c 'import json; from pathlib import Path; p=Path("data/latest.json"); print((json.loads(p.read_text(encoding="utf-8")).get("dateTo") or "") if p.exists() else "")' 2>/dev/null || true)
          TARGET_TO=$(TZ=Europe/Warsaw date -d "+6 days" +%F)
          API_KEY_CONFIGURED=false
          if [ -n "${API_FOOTBALL_KEY:-}" ]; then API_KEY_CONFIGURED=true; fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=Ręczne uruchomienie" >> "$GITHUB_OUTPUT"
          elif [ "$HOUR" = "13" ] && { [ "$GENERATED_DATE" != "$TODAY" ] || [[ "$GENERATED_TO" < "$TARGET_TO" ]] || { [ "$API_KEY_CONFIGURED" = "true" ] && [ "$API_GENERATED_DATE" != "$TODAY" ]; }; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=Brak dzisiejszej publikacji lub weryfikacji API-Football; ponawiam próbę" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=Dane są już opublikowane dzisiaj albo nie nadeszła jeszcze pora publikacji" >> "$GITHUB_OUTPUT"
          fi

          echo "Godzina w Polsce: $HOUR"
          echo "Dzisiejsza data: $TODAY"
          echo "Data ostatniej publikacji: ${GENERATED_DATE:-brak}"
          echo "Data weryfikacji API-Football: ${API_GENERATED_DATE:-brak}"
          echo "Zakres terminarza do: ${GENERATED_TO:-brak}; wymagany do: $TARGET_TO"
          echo "Decyzja: $(grep '^run=' "$GITHUB_OUTPUT" | tail -n 1)"

      - name: Generuj prognozy (football-data.org)
        if: steps.timecheck.outputs.run == 'true'
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/update_predictions.py

      - name: Zsynchronizuj źródła uzupełniające (Sportmonks + API-Football)
        if: steps.timecheck.outputs.run == 'true'
        continue-on-error: true
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/sync_data_sources.py

      - name: Sprawdź wygenerowane dane
        if: steps.timecheck.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path("data/latest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          now_date = datetime.now(ZoneInfo("Europe/Warsaw")).date().isoformat()
          generated = data.get("generatedAt", "")
          if generated[:10] != now_date:
              raise SystemExit(f"Nieaktualna data generatedAt: {generated}; oczekiwano {now_date}")
          matches = data.get("matches")
          if not isinstance(matches, list):
              raise SystemExit("Pole matches nie jest listą")
          if data.get("count") != len(matches):
              raise SystemExit("Pole count nie zgadza się z liczbą meczów")
          print(f"OK: {len(matches)} meczów, generatedAt={generated}, filtr godzin wyłączony")
          PY

      - name: Zapisz wyniki
        if: steps.timecheck.outputs.run == 'true'
        run: |
          git config user.name "Goal Predictor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          if [ -f data/api-football.json ]; then git add data/api-football.json; fi
          if [ -f data/sportmonks.json ]; then git add data/sportmonks.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja prognoz i weryfikacji terminarza"
            git pull --rebase origin main
            git push
          else
            echo "Brak zmian w danych do zapisania."
          fi

      - name: Podsumowanie
        if: always()
        run: |
          echo "## Publikacja Goal Predictor AI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Decyzja: ${{ steps.timecheck.outputs.run || 'brak' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Powód: ${{ steps.timecheck.outputs.reason || 'sprawdź logi wcześniejszych kroków' }}" >> "$GITHUB_STEP_SUMMARY"
