name: Sportmonks Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * *"

permissions:
  contents: write

concurrency:
  group: goal-predictor-publish
  cancel-in-progress: false

jobs:
  update-sportmonks:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Uruchom Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pobierz kompaktowy feed Sportmonks
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS }}
        run: python scripts/update_sportmonks.py
      - name: Zweryfikuj pliki danych
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          feed = json.loads(Path("data/sportmonks.json").read_text(encoding="utf-8"))
          assert isinstance(feed.get("fixtures"), list)
          assert feed.get("count") == len(feed["fixtures"])
          size_bytes = Path("data/sportmonks.json").stat().st_size
          assert size_bytes < 5 * 1024 * 1024, f"Feed Sportmonks jest za duży: {size_bytes} bajtów"
          print(f"OK: Sportmonks {feed['count']} fixtures; {size_bytes // 1024} KB")
          PY
      - name: Zapisz dane
        run: |
          git config user.name "Goal Predictor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sportmonks.json
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja danych Sportmonks"
            git pull --rebase origin main
            git push
          else
            echo "Brak zmian do zapisania."
          fi
